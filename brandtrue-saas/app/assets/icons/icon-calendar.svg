<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#F5ECDA"/>
      <stop offset="100%" stop-color="#D2BC7C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4820" flood-opacity="0.2"/>
    </filter>
    <clipPath id="cal-clip">
      <rect x="15" y="24" width="70" height="58" rx="5"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#shine)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="none" stroke="#C0A040" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Calendar body -->
  <rect x="15" y="24" width="70" height="58" rx="5"
    fill="#8B6C32" fill-opacity="0.1" stroke="#8B6C32" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Header fill (clipped) -->
  <rect x="15" y="24" width="70" height="18" fill="#8B6C32" fill-opacity="0.4" clip-path="url(#cal-clip)"/>
  <!-- Header divider -->
  <line x1="15" y1="42" x2="85" y2="42" stroke="#8B6C32" stroke-width="2" stroke-opacity="0.85"/>
  <!-- Ring posts -->
  <rect x="30" y="17" width="7" height="14" rx="3.5" fill="#8B6C32" fill-opacity="0.85"/>
  <rect x="63" y="17" width="7" height="14" rx="3.5" fill="#8B6C32" fill-opacity="0.85"/>
  <!-- Date dots — row 1 -->
  <circle cx="27" cy="53" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="38" cy="53" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="50" cy="53" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="62" cy="53" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="73" cy="53" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <!-- Date dots — row 2 -->
  <circle cx="27" cy="65" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="38" cy="65" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="50" cy="65" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="62" cy="65" r="3" fill="#8B6C32" fill-opacity="0.85"/>
  <circle cx="73" cy="65" r="3" fill="#8B6C32" fill-opacity="0.85"/>
</svg>
