<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#F5ECDA"/>
      <stop offset="100%" stop-color="#D2BC7C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4820" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#shine)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="none" stroke="#C0A040" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Document body -->
  <path d="M 28,18 L 62,18 L 74,30 L 74,82 L 28,82 Z"
    fill="#8B6C32" fill-opacity="0.1" stroke="#8B6C32" stroke-width="2.5" stroke-opacity="0.85" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M 62,18 L 62,30 L 74,30"
    fill="none" stroke="#8B6C32" stroke-width="2.5" stroke-opacity="0.85" stroke-linejoin="round"/>
  <!-- Text lines -->
  <line x1="36" y1="44" x2="66" y2="44" stroke="#8B6C32" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="36" y1="54" x2="66" y2="54" stroke="#8B6C32" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="36" y1="64" x2="54" y2="64" stroke="#8B6C32" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
