<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#F5ECDA"/>
      <stop offset="100%" stop-color="#D2BC7C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4820" flood-opacity="0.2"/>
    </filter>
    <clipPath id="frame">
      <rect x="22" y="24" width="56" height="48" rx="3"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#shine)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="none" stroke="#C0A040" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Photo frame fill -->
  <rect x="22" y="24" width="56" height="48" rx="3" fill="#8B6C32" fill-opacity="0.1"/>
  <!-- Mountain landscape clipped inside frame -->
  <g clip-path="url(#frame)">
    <circle cx="34" cy="36" r="7" fill="#8B6C32" fill-opacity="0.85"/>
    <polygon points="18,75 40,45 58,62 68,50 82,75" fill="#8B6C32" fill-opacity="0.85"/>
  </g>
  <!-- Frame border -->
  <rect x="22" y="24" width="56" height="48" rx="3" fill="none" stroke="#8B6C32" stroke-width="2.5" stroke-opacity="0.85"/>
</svg>
