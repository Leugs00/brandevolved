<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#F5ECDA"/>
      <stop offset="100%" stop-color="#D2BC7C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4820" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="url(#shine)"/>
  <rect x="6" y="6" width="88" height="88" rx="21" fill="none" stroke="#C0A040" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Clock face -->
  <circle cx="50" cy="51" r="31" fill="#8B6C32" fill-opacity="0.1" stroke="#8B6C32" stroke-width="3" stroke-opacity="0.85"/>
  <!-- Inner ring -->
  <circle cx="50" cy="51" r="27" fill="none" stroke="#8B6C32" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Hour tick marks (12, 3, 6, 9) -->
  <line x1="50" y1="22" x2="50" y2="28" stroke="#8B6C32" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="79" y1="51" x2="73" y2="51" stroke="#8B6C32" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="50" y1="80" x2="50" y2="74" stroke="#8B6C32" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="21" y1="51" x2="27" y2="51" stroke="#8B6C32" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Hour hand (~10 o'clock) -->
  <line x1="50" y1="51" x2="37" y2="34" stroke="#8B6C32" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Minute hand (~2 o'clock) -->
  <line x1="50" y1="51" x2="64" y2="30" stroke="#8B6C32" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Center dot -->
  <circle cx="50" cy="51" r="3.5" fill="#8B6C32" fill-opacity="0.85"/>
</svg>
